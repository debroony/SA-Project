<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยินดีต้อนรับ - ร้านเบเกอรี่ by น้องเอี่ยมอ่อง ThaiPBS</title>
    <style>
        :root {
            --primary-color: #5c4033; /* สีน้ำตาลช็อกโกแลต */
            --accent-color: #f7e7ce;  
            --text-color: #333;
            --bg-color: #fafafa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: radial-gradient(circle at center, #fff, #fafafa);
        }

        .welcome-container {
            background-color: white;
            padding: 3rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* ปุ่มหลัก (Login) */
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: 2px solid var(--primary-color);
        }

        .btn-primary:hover {
            background-color: #4a3329;
            border-color: #4a3329;
        }

        /* ปุ่มรอง (Register) */
        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-outline:hover {
            background-color: var(--accent-color);
            color: var(--primary-color);
        }

        /* ลิงก์สำหรับ Admin */
        .admin-link {
            display: inline-block;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #888;
            text-decoration: none;
            transition: color 0.3s;
        }

        .admin-link:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <h1>ยินดีต้อนรับ - ร้านเบเกอรี่ by น้องเอี่ยมอ่อง ThaiPBS</h1>
        <p class="subtitle">ระบบสั่งจองขนมล่วงหน้า (Pre-order System)</p>

        <div class="button-group">
            <a href="login.html" class="btn btn-primary">เข้าสู่ระบบ</a>
            <a href="register.html" class="btn btn-outline">สมัครสมาชิกใหม่</a>
        </div>

        <!-- ลิงก์ไปหน้า login ของ Admin -->
        <a href="admin_login.html" class="admin-link">สำหรับผู้ดูแลร้าน (Admin Login)</a>
    </div>

</body>
</html>
