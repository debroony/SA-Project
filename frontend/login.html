<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ร้านขนมไทย by น้องเอี่ยมอ่อง Thai PBS</title>
    <style>
        :root {
            --primary-color: #5c4033; /* สีน้ำตาลช็อกโกแลต */
            --accent-color: #f7e7ce;  
            --text-color: #333;
            --bg-color: #fafafa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* ให้กล่องอยู่กึ่งกลางหน้าจอแนวตั้ง */
        }

        .auth-container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--primary-color);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(92, 64, 51, 0.2);
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background-color: #4a3329;
        }

        .toggle-link {
            display: block;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .toggle-link span {
            color: var(--primary-color);
            font-weight: bold;
        }

        .toggle-link:hover span {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>เข้าสู่ระบบ</h1>
        <p class="subtitle">ยินดีต้อนรับกลับสู่ร้านขนมไทย by น้องเอี่ยมอ่อง Thai PBS</p>

        <!-- ฟอร์มเข้าสู่ระบบ -->
        <form id="loginForm">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้งาน หรือ อีเมล</label>
                <input type="text" id="username" name="username" placeholder="กรอกชื่อผู้ใช้งาน" required>
            </div>

            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่าน" required>
            </div>

            <button type="submit" class="submit-btn">เข้าสู่ระบบ</button>
        </form>

        <script>
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch('http://localhost:8080/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const result = await response.json();
                    if (result.success) {
                        localStorage.setItem('customer_id', result.id);
                        localStorage.setItem('username', result.username || username);
                        localStorage.setItem('role', result.role);

                        if (result.role === 'admin') {
                            window.location.href = 'admin_dashboard.html';
                        } else {
                            window.location.href = 'order.html';
                        }
                    } else {
                        alert('เข้าสู่ระบบไม่สำเร็จ: ' + (result.error || 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง'));
                    }
                } catch (err) {
                    console.error(err);
                    alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
                }
            });
        </script>

        <!-- ลิงก์ไปหน้าสมัครสมาชิก -->
        <a href="register.html" class="toggle-link">ยังไม่มีบัญชีใช่ไหม? <span>สมัครสมาชิกที่นี่</span></a>
    </div>

</body>
</html>
